[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hrt-algo-arena"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "pandas==2.3.3", "pyarrow==21.0.0", "scikit-learn==1.6.1", "scipy==1.13.1"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
